name: Build App

on:
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Install Fyne CLI
        run: go install fyne.io/fyne/v2/cmd/fyne@latest

      - name: Package App
        run: |
          export PATH=$PATH:$(go env GOPATH)/bin
          fyne package -os darwin -icon Icon.png -name "AppleStoreHelper"
          zip -r AppleStoreHelper-mac.zip "AppleStoreHelper.app"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mac-app
          path: AppleStoreHelper-mac.zip

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build exe
        run: go build -ldflags "-H windowsgui" -o AppleStoreHelper.exe .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: AppleStoreHelper.exe
